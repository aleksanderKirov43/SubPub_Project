name: Go CI/CD Pipeline
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests & Code Checks
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Dependencies
        run: go mod tidy

      - name: Lint Code
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest && golangci-lint run ./...

      - name: Check for Issues (go vet)
        run: go vet ./...

      - name: Format Code (go fmt)
        run: go fmt ./...

      - name: Run Unit Tests
        run: go test ./...
